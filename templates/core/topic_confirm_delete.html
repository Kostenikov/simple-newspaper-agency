{% extends "base.html" %}

{% block content %}
  <h1>Delete Topic?</h1>

  <p>Are you sure you want to delete this topic: {{ topic }}?</p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Delete" class="btn btn-danger">
    <a href="javascript:history.back()" class="btn btn-dark">Cancel</a>
  </form>
{% endblock %}
