{% extends "base.html" %}

{% block content %}
  <div class="container my-4">

    <div class="card border-primary shadow-sm mb-4">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-tags me-2"></i> Topics</h5>
        <a href="{% url 'core:topic-create' %}" class="btn btn-light btn-sm">
          <i class="bi bi-plus-circle me-1"></i> Add new
        </a>
      </div>
      <div class="card-body">
        {% include "includes/search_form.html" %}
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        {% if topic_list %}
          <table class="table table-striped table-hover mb-0">
            <thead class="table-primary">
            <tr>
              <th>#</th>
              <th>Topic name</th>
              <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            {% for topic in topic_list %}
              <tr class="align-middle">
                <th scope="row">
                  <a href="{% url 'core:topic-detail' pk=topic.pk %}" class="link-primary text-decoration-none">
                    {{ topic.id }}
                  </a>
                </th>
                <td><span class="badge bg-secondary">{{ topic.name }}</span></td>
                <td class="text-center">
                  <a href="{% url 'core:topic-update' pk=topic.pk %}" class="btn btn-sm btn-outline-primary me-1">
                    <i class="bi bi-arrow-repeat"></i>
                  </a>
                  <a href="{% url 'core:topic-delete' pk=topic.pk %}" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash"></i>
                  </a>
                </td>
              </tr>
            {% endfor %}
            </tbody>
          </table>
        {% else %}
          <div class="p-3">
            <h6 class="text-muted mb-0">There are no topics!</h6>
          </div>
        {% endif %}
      </div>
    </div>

  </div>
{% endblock %}
