{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} Newspaper</h1>
  <form action="" method="post">
    {% csrf_token %}
    <div class="w-25">
      {{ form|crispy }}
    </div>

    <input type="submit" value="{{ object|yesno:"Update,Create" }}" class="btn btn-outline-success">
    <a href="javascript:history.back()" class="btn btn-outline-dark">Cancel</a>
  </form>
{% endblock %}
