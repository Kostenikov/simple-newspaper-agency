{% extends "base.html" %}

{% block content %}
  <div class="container my-5 d-flex justify-content-center">

    <div class="card p-4 shadow-sm text-center" style="max-width: 400px; width: 100%; background-color: #ffffff;">
      <h3 class="text-success mb-3">
        <i class="bi bi-check-circle-fill"></i> Logged out
      </h3>
      <p class="text-muted mb-4">
        You have been successfully logged out of your account.
      </p>
      <a href="{% url 'login' %}" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right"></i> Log in again
      </a>
    </div>

  </div>
{% endblock %}
